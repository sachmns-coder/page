<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes sites</title>
<style>
  :root{ --bg:#f7f3ec; --ink:#232733; --muted:#9a948a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:"Nunito","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;padding:clamp(14px,2.4vh,28px) clamp(14px,3vw,40px) 8px;gap:clamp(10px,2vh,22px);
  }

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;flex:none}
  .left{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .clock{font-size:clamp(30px,5vh,46px);font-weight:800;letter-spacing:-1px;line-height:1}
  .meta{display:flex;flex-direction:column;line-height:1.25}
  .hello{font-weight:700;font-size:15px}
  .date{color:var(--muted);font-size:13px;text-transform:capitalize}
  .search{
    width:min(280px,100%);background:#fff;border:2px solid transparent;color:var(--ink);
    padding:10px 18px;border-radius:999px;font-size:14px;outline:none;font-family:inherit;
    box-shadow:0 2px 10px rgba(60,40,10,.07);transition:border-color .2s;
  }
  .search::placeholder{color:#b3ada2}
  .search:focus{border-color:#232733}

  .pile{
    flex:1;min-height:0;display:grid;gap:clamp(10px,1.8vh,18px);
    grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));
    grid-template-rows:repeat(var(--rows,2),minmax(0,1fr));
  }
  .empty{grid-column:1/-1;display:grid;place-items:center;color:var(--muted)}
  .cell{container-type:size;min-width:0;min-height:0;display:flex;transition:opacity .15s}
  .cell.dragging{opacity:.35}
  .cell.over .card{outline:4px dashed var(--ink);outline-offset:-4px}
  .card{
    --rot:0deg;
    position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqh;
    background:var(--c);color:var(--ink);text-decoration:none;border-radius:28px;
    transform:rotate(var(--rot));
    box-shadow:0 6px 0 rgba(0,0,0,.08),0 14px 24px -12px rgba(60,40,10,.25);
    transition:transform .25s cubic-bezier(.2,1.5,.4,1), box-shadow .25s;
    animation:pop .5s both;overflow:hidden;-webkit-user-drag:none;user-select:none;
  }
  .still .card{animation:none}
  @keyframes pop{from{opacity:0;transform:scale(.85) rotate(var(--rot))}}
  .card:hover{transform:rotate(0) translateY(-6px) scale(1.03);box-shadow:0 10px 0 rgba(0,0,0,.08),0 22px 30px -12px rgba(60,40,10,.3);z-index:3}
  .card:active{transform:scale(.98)}
  .card::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.28);right:-18%;top:-30%}
  .card::after{content:"";position:absolute;width:40%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2);left:-10%;bottom:-22%}
  .icon{
    position:relative;z-index:1;width:clamp(34px,36cqmin,120px);height:clamp(34px,36cqmin,120px);
    background:#fff;border-radius:26%;display:grid;place-items:center;overflow:hidden;
    box-shadow:0 5px 14px rgba(0,0,0,.14);font-size:clamp(20px,20cqmin,66px);
  }
  .icon img{width:62%;height:62%;object-fit:contain;pointer-events:none}
  .name{position:relative;z-index:1;font-weight:800;font-size:clamp(14px,8cqmin,24px);text-align:center;padding:0 10px;letter-spacing:.2px}

  /* compteur de clics */
  .count{
    position:absolute;z-index:2;right:12px;bottom:10px;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.65);padding:3px 9px;border-radius:999px;display:none;
  }
  .count.on{display:block}

  /* boutons du mode modification */
  .tools{position:absolute;top:10px;right:10px;z-index:3;display:none;gap:6px}
  .editing .tools{display:flex}
  .tools button{
    width:30px;height:30px;border-radius:50%;border:none;background:#232733;color:#fff;
    cursor:pointer;font-size:15px;line-height:1;
  }
  .tools button:hover{background:#000;transform:scale(1.1)}
  .editing .card{animation:wiggle .3s infinite alternate}
  @keyframes wiggle{from{transform:rotate(calc(var(--rot) - 1deg))}to{transform:rotate(calc(var(--rot) + 1deg))}}
  .cell[draggable="true"]{cursor:grab}

  .foot{flex:none;text-align:center;font-size:11px;opacity:.35;transition:opacity .2s;padding-bottom:2px}
  .foot:hover{opacity:1}
  .foot button{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 7px;font-family:inherit}
  .foot button:hover{color:var(--ink);text-decoration:underline}

  dialog{margin:auto;background:#fff;color:var(--ink);border:none;border-radius:24px;padding:26px;width:min(420px,92vw);box-shadow:0 30px 80px rgba(60,40,10,.3)}
  dialog::backdrop{background:rgba(40,30,15,.35)}
  dialog h2{margin-bottom:8px;font-size:20px}
  dialog label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}
  dialog input[type=text]{width:100%;background:var(--bg);border:2px solid transparent;color:var(--ink);padding:12px 14px;border-radius:14px;font-size:15px;outline:none;font-family:inherit}
  dialog input[type=text]:focus{border-color:var(--ink)}
  .row{display:flex;gap:12px}
  .row > div{flex:1}
  input[type=color]{width:100%;height:46px;border:none;background:var(--bg);border-radius:14px;padding:4px;cursor:pointer}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
  .btn{border:none;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;background:var(--ink);font-family:inherit}
  .btn.ghost{background:var(--bg);color:var(--ink)}

  @media (max-width:560px){ .search{width:100%} header{flex-direction:column;align-items:stretch} }
</style>
</head>
<body>
<header>
  <div class="left">
    <div class="clock" id="clock">--:--</div>
    <div class="meta"><span class="hello" id="hello"></span><span class="date" id="date"></span></div>
  </div>
  <input class="search" id="search" type="search" placeholder="Rechercher…">
</header>

<main class="pile" id="pile"></main>

<div class="foot">
  <button id="add">+ ajouter</button>·<button id="edit">modifier</button>·<button id="sort">trier par clics</button>·<button id="zero">compteurs à zéro</button>·<button id="reset">réinitialiser</button>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlg-title">Ajouter un site</h2>
    <label for="f-name">Nom</label>
    <input type="text" id="f-name" required placeholder="Ex : Twitch">
    <label for="f-url">Lien</label>
    <input type="text" id="f-url" required placeholder="Ex : twitch.tv">
    <div class="row">
      <div>
        <label for="f-emoji">Emoji de secours (si pas d'icône)</label>
        <input type="text" id="f-emoji" maxlength="4" placeholder="🎮">
      </div>
      <div>
        <label for="f-color">Couleur</label>
        <input type="color" id="f-color" value="#ffd36b">
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Annuler</button>
      <button class="btn" type="submit" id="ok">Ajouter</button>
    </div>
  </form>
</dialog>

<script>
const DEFAULTS = [
  {name:"WAX TCG",  url:"https://www.waxtcg.com",   c:"#ffb547", emoji:"🃏"},
  {name:"YouTube",  url:"https://www.youtube.com",  c:"#ff7a7a", emoji:"▶️"},
  {name:"ChatGPT",  url:"https://chatgpt.com",      c:"#62d6a8", emoji:"🤖"},
  {name:"Snapchat", url:"https://www.snapchat.com", c:"#ffe35c", emoji:"👻"},
  {name:"Deezer",   url:"https://www.deezer.com",   c:"#b99bff", emoji:"🎧"},
  {name:"Franime",  url:"https://franime.fr",       c:"#6cc4ff", emoji:"🍥"}
];
const PALETTE = ["#ffb547","#ff7a7a","#62d6a8","#ffe35c","#b99bff","#6cc4ff","#ff9ed2","#9be37a"];
const ROT = [-1.6, 1.2, -0.8, 1.8, -1.2, 0.9];
const KEY = "mes-sites-v3";
let sites = load(), editing = false, editIdx = -1, dragFrom = -1, animate = true;

function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(s) && s.length) return s; }catch(e){}
  return DEFAULTS.map(s=>({...s}));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(sites)); }catch(e){} }
function domain(u){ try{ return new URL(u).hostname; }catch(e){ return ""; } }
function normalize(u){ u=u.trim(); return /^https?:\/\//i.test(u) ? u : "https://"+u; }
function hue(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return h; }
function hslToHex(h,s,l){
  s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))))).toString(16).padStart(2,"0");
  return "#"+f(0)+f(8)+f(4);
}
function colorOf(s){ return s.c || s.c1 || hslToHex(hue(s.name),85,72); }

function layout(n){
  const pile = document.getElementById("pile");
  const w = pile.clientWidth || innerWidth, h = pile.clientHeight || innerHeight;
  n = Math.max(n,1);
  let best = 1, bestScore = Infinity;
  for(let c=1;c<=n;c++){
    const r = Math.ceil(n/c);
    const score = Math.abs(Math.log(((w/c)/(h/r)) / 1.15));
    if(score < bestScore){ bestScore = score; best = c; }
  }
  pile.style.setProperty("--cols", best);
  pile.style.setProperty("--rows", Math.ceil(n/best));
}

function updateCount(el, s){
  const n = s.clicks || 0;
  el.textContent = "👆 " + n;
  el.classList.toggle("on", n > 0);
}

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const pile = document.getElementById("pile");
  pile.classList.toggle("editing", editing);
  pile.classList.toggle("still", !animate);
  pile.innerHTML = "";
  const list = sites.map((s,i)=>({s,i})).filter(({s})=>s.name.toLowerCase().includes(q)||s.url.toLowerCase().includes(q));
  layout(list.length);
  if(!list.length){ pile.innerHTML = '<div class="empty">Aucun site trouvé.</div>'; return; }
  const canDrag = !q; // pas de glisser-déposer pendant une recherche

  list.forEach(({s,i},n)=>{
    const cell = document.createElement("div"); cell.className = "cell";
    if(canDrag){
      cell.draggable = true;
      cell.addEventListener("dragstart", e=>{ dragFrom = i; cell.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain", String(i));}catch(_){} });
      cell.addEventListener("dragend", ()=>{ cell.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); });
      cell.addEventListener("dragover", e=>{ if(dragFrom<0) return; e.preventDefault(); cell.classList.add("over"); });
      cell.addEventListener("dragleave", ()=>cell.classList.remove("over"));
      cell.addEventListener("drop", e=>{
        e.preventDefault(); cell.classList.remove("over");
        if(dragFrom<0 || dragFrom===i) return;
        const [moved] = sites.splice(dragFrom,1);
        sites.splice(i,0,moved);
        dragFrom = -1; save(); animate = false; render();
      });
    }

    const a = document.createElement("a");
    a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener"; a.draggable = false;
    a.style.cssText = `--c:${colorOf(s)};--rot:${ROT[i % ROT.length]}deg;animation-delay:${n*60}ms`;

    const icon = document.createElement("div"); icon.className = "icon";
    const fallback = () => { icon.innerHTML = ""; icon.textContent = s.emoji || s.name.charAt(0).toUpperCase(); icon.style.fontWeight = "800"; };
    const img = new Image(); img.alt = ""; img.draggable = false;
    img.src = "https://www.google.com/s2/favicons?domain=" + domain(s.url) + "&sz=128";
    img.onerror = fallback;
    img.onload = () => { if(img.naturalWidth < 20) fallback(); };
    icon.appendChild(img);

    const name = document.createElement("div"); name.className = "name"; name.textContent = s.name;

    const count = document.createElement("div"); count.className = "count"; updateCount(count, s);

    const tools = document.createElement("div"); tools.className = "tools";
    const ed = document.createElement("button"); ed.textContent = "✎"; ed.title = "Modifier";
    ed.onclick = e => { e.preventDefault(); e.stopPropagation(); openDialog(i); };
    const del = document.createElement("button"); del.textContent = "×"; del.title = "Supprimer";
    del.onclick = e => {
      e.preventDefault(); e.stopPropagation();
      if(confirm("Supprimer " + s.name + " ?")){ sites.splice(i,1); save(); animate=false; render(); }
    };
    tools.append(ed, del);

    // compteur : clic gauche, clic molette
    const hit = e => {
      if(editing){ e.preventDefault(); return; }
      s.clicks = (s.clicks||0) + 1; save(); updateCount(count, s);
    };
    a.addEventListener("click", hit);
    a.addEventListener("auxclick", e=>{ if(e.button===1) hit(e); });

    a.append(icon, name, count, tools);
    cell.appendChild(a);
    pile.appendChild(cell);
  });
  animate = true;
}

/* ---------- Fenêtre ajouter / modifier ---------- */
const dlg = document.getElementById("dlg");
function openDialog(idx){
  editIdx = idx;
  const s = idx>=0 ? sites[idx] : null;
  document.getElementById("dlg-title").textContent = s ? "Modifier le site" : "Ajouter un site";
  document.getElementById("ok").textContent = s ? "Enregistrer" : "Ajouter";
  document.getElementById("f-name").value = s ? s.name : "";
  document.getElementById("f-url").value = s ? s.url : "";
  document.getElementById("f-emoji").value = s ? (s.emoji||"") : "";
  document.getElementById("f-color").value = s ? colorOf(s) : PALETTE[sites.length % PALETTE.length];
  dlg.showModal();
}
document.getElementById("add").onclick = () => openDialog(-1);
document.getElementById("cancel").onclick = () => dlg.close();
document.getElementById("form").addEventListener("submit", () => {
  const name = document.getElementById("f-name").value.trim();
  const url = normalize(document.getElementById("f-url").value);
  const emoji = document.getElementById("f-emoji").value.trim();
  const c = document.getElementById("f-color").value;
  if(!name || !url) return;
  if(editIdx>=0){
    Object.assign(sites[editIdx], {name, url, emoji, c});
    delete sites[editIdx].c1; delete sites[editIdx].c2;
  } else {
    sites.push({name, url, emoji, c, clicks:0});
  }
  save(); animate = false; render();
});

/* ---------- Divers ---------- */
function tick(){
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const h = d.getHours();
  document.getElementById("hello").textContent = h<5 ? "Bonne nuit" : h<12 ? "Bonjour" : h<18 ? "Bon après-midi" : "Bonsoir";
}
tick(); setInterval(tick, 1000);

const search = document.getElementById("search");
search.addEventListener("input", ()=>{ animate=false; render(); });
search.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const f=document.querySelector(".card"); if(f) f.click(); }});
addEventListener("resize", ()=>layout(document.querySelectorAll(".card").length));

document.getElementById("edit").onclick = e => {
  editing = !editing; e.target.textContent = editing ? "terminé" : "modifier"; animate=false; render();
};
document.getElementById("sort").onclick = () => {
  sites.sort((a,b)=>(b.clicks||0)-(a.clicks||0)); save(); animate=false; render();
};
document.getElementById("zero").onclick = () => {
  if(confirm("Remettre tous les compteurs de clics à zéro ?")){ sites.forEach(s=>s.clicks=0); save(); animate=false; render(); }
};
document.getElementById("reset").onclick = () => {
  if(confirm("Remettre la liste de départ ?")){ sites = DEFAULTS.map(s=>({...s})); save(); animate=false; render(); }
};
render();
</script>
</body>
</html>
